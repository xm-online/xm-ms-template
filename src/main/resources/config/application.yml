management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - metrics
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    tags:
      application: ${spring.application.name}

spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: servlet
  cloud:
    # if you need to start service without consul, use next configuration and disable consul by spring.cloud.consul.enabled
    #    discovery:
    #      client:
    #        simple:
    #          instances:
    #            config:
    #              - instanceId: config
    #                serviceId: config
    #                host: localhost
    #                port: 8084
    consul:
      enabled: true
      discovery:
        query-passing: true
        healthCheckPath: /management/health
        instanceId: mstemplate:${spring.application.instance-id:${random.value}}
        service-name: mstemplate
      config:
        watch:
          enabled: false
  config:
    group:
      dev:
        - dev
        - api-docs
  data:
    jpa:
      repositories:
        bootstrap-mode: default
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_empty
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: PLAINTEXT # SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_PLAINTEXT, protocol to the brokers: PLAINTEXT, SASL_PLAINTEXT, SSL, SASL_SSL; empty is not allowed
      sasl.mechanism: # SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=SCRAM-SHA-512, SASL mechanism: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
      sasl.jaas.config: # SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required username="user" password="secret";, SASL login and password
      # ssl.endpoint.identification.algorithm: # SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https, check of the broker host name in its certificate, https when not set; empty switches the check off
      # OAUTHBEARER (SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=OAUTHBEARER, SASL_JAAS_CONFIG with org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="id" clientSecret="secret";):
      sasl.oauthbearer.token.endpoint.url: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL=https://idp/oauth/token, where the client gets the token
      sasl.oauthbearer.jwks.endpoint.url: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL=https://idp/oauth/jwks, keys to validate the token, when the client validates it
      # sasl.oauthbearer.scope.claim.name: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_SCOPE_CLAIM_NAME=scope, claim of the scope in the token, scope when not set
      # sasl.oauthbearer.sub.claim.name: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_SUB_CLAIM_NAME=sub, claim of the principal in the token, sub when not set
      # sasl.login.callback.handler.class: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler, gets the token for OAUTHBEARER
      # sasl.client.callback.handler.class: # SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS=com.example.CustomClientCallbackHandler, custom SASL client callback handler
      # sasl.login.class: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CLASS=org.apache.kafka.common.security.oauthbearer.internals.OAuthBearerRefreshingLogin, custom login class
      # sasl.login.connect.timeout.ms: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CONNECT_TIMEOUT_MS=10000, connect timeout to the token endpoint
      # sasl.login.read.timeout.ms: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_READ_TIMEOUT_MS=10000, read timeout from the token endpoint
      # GSSAPI (SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=GSSAPI, SASL_JAAS_CONFIG with com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true keyTab="/etc/kafka.keytab" principal="mstemplate@REALM";):
      sasl.kerberos.service.name: # SPRING_KAFKA_PROPERTIES_SASL_KERBEROS_SERVICE_NAME=kafka, Kerberos principal name of the broker
    ssl: # the commented out properties break SSL when empty, set them by the environment variables when needed
      trust-store-location: # SPRING_KAFKA_SSL_TRUST_STORE_LOCATION=file:/certs/ca.p12, CA of the broker certificate, for SSL and SASL_SSL
      # trust-store-password: # SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD=changeit, password of the trust store
      trust-store-type: # SPRING_KAFKA_SSL_TRUST_STORE_TYPE=PKCS12, type of the trust store: PKCS12, JKS, PEM
      key-store-location: # SPRING_KAFKA_SSL_KEY_STORE_LOCATION=file:/certs/mstemplate.p12, client certificate, for SSL and SASL_SSL
      # key-store-password: # SPRING_KAFKA_SSL_KEY_STORE_PASSWORD=changeit, password of the key store file
      key-store-type: # SPRING_KAFKA_SSL_KEY_STORE_TYPE=PKCS12, type of the key store: PKCS12, JKS, PEM
      # key-password: # SPRING_KAFKA_SSL_KEY_PASSWORD=changeit, password of the private key, when it differs from the key store password
      # protocol: # SPRING_KAFKA_SSL_PROTOCOL=TLSv1.3, TLS protocol, Kafka default when not set
      bundle: # SPRING_KAFKA_SSL_BUNDLE=kafka, name of a spring.ssl.bundle instead of the key store and trust store above
      # the bundle itself, SPRING_SSL_BUNDLE_JKS_KAFKA_*; empty values break the bundle, set them by the environment variables when needed:
      # ssl.bundle.jks.kafka.truststore.location: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_LOCATION=file:/certs/ca.p12, CA of the broker certificate
      # ssl.bundle.jks.kafka.truststore.password: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_PASSWORD=changeit, password of the trust store
      # ssl.bundle.jks.kafka.truststore.type: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_TYPE=PKCS12, type of the trust store
      # ssl.bundle.jks.kafka.keystore.location: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_LOCATION=file:/certs/mstemplate.p12, client certificate
      # ssl.bundle.jks.kafka.keystore.password: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_PASSWORD=changeit, password of the key store
      # ssl.bundle.jks.kafka.keystore.type: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_TYPE=PKCS12, type of the key store
      # PEM instead of the store files above:
      # key-store-certificate-chain: # SPRING_KAFKA_SSL_KEY_STORE_CERTIFICATE_CHAIN=-----BEGIN CERTIFICATE-----..., client certificate chain in PEM, with SPRING_KAFKA_SSL_KEY_STORE_TYPE=PEM
      # key-store-key: # SPRING_KAFKA_SSL_KEY_STORE_KEY=-----BEGIN PRIVATE KEY-----..., client private key in PEM, with SPRING_KAFKA_SSL_KEY_STORE_TYPE=PEM
      # trust-store-certificates: # SPRING_KAFKA_SSL_TRUST_STORE_CERTIFICATES=-----BEGIN CERTIFICATE-----..., CA certificates in PEM, with SPRING_KAFKA_SSL_TRUST_STORE_TYPE=PEM
    #  To start using feign client with authentication, use this configuration and provide correct
    #  token-uri, client-id and client-secret
  security:
      oauth2:
        client:
          provider:
            uaa:
              token-uri: http://localhost:9999/oauth/token
          registration:
            uaa:
              authorization-grant-type: client_credentials
              client-id: internal
  messages:
    basename: i18n/messages
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: xm-ms-template-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: xm-ms-template-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true
server:
  servlet:
    session:
      cookie:
        http-only: true

# Defaults come from xm-commons (xm-defaults.yml). Uncomment to override for this service:
# springdoc:
#   show-actuator: false

xm-config:
  enabled: true
  xm-config-url: http://config
  kafka-config-topic: config_topic

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'mstemplateApp'
  api-docs:
    default-include-pattern: ${server.servlet.context-path:}/api/**
    management-include-pattern: ${server.servlet.context-path:}/management/**
    title: Mstemplate API
    description: Mstemplate API documentation
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:"

application:
  specification-path-pattern: /config/tenants/{tenantName}/${spring.application.name}/example-of-microservice-spec.yml
  tenant-ignored-path-list: /v3/api-docs, /api/profile-info, /swagger-resources/configuration/ui, /management/health, /management/prometheus
  timeline-ignored-http-methods:

  timelines-enabled: false
  kafka-enabled: true
  scheduler-enabled: false

  tenant-with-creation-access-list: XM, MANAGER
  kafka-system-topic: system_topic
  kafka-system-queue: system_queue
  kafka-metadata-max-age: 60000 #in milliseconds
  kafkaHealth:
    enabled: true
  config-fetch-all:
    enabled: false
  tenant-memory-cache:
    enabled: # APPLICATION_TENANT_MEMORY_CACHE_ENABLED=true, caches of cache.yml; with strategy REDIS they use the Redis connection below
  tenant-cache:
    redis: # the commented out properties break the connection when empty, set them by the environment variables when needed
      enabled: # APPLICATION_TENANT_CACHE_REDIS_ENABLED=true, Redis connection of xm-commons-cache-redis for caches with strategy REDIS in cache.yml
      # host: # APPLICATION_TENANT_CACHE_REDIS_HOST=redis, Redis host, localhost when not set
      # port: # APPLICATION_TENANT_CACHE_REDIS_PORT=6379, Redis port, 6379 when not set
      username: # APPLICATION_TENANT_CACHE_REDIS_USERNAME=user, Redis ACL user, default user when not set
      password: # APPLICATION_TENANT_CACHE_REDIS_PASSWORD=secret, Redis password (requirepass or the ACL user password)
      ssl: # APPLICATION_TENANT_CACHE_REDIS_SSL=true, TLS to Redis, the server certificate must be trusted by the JVM
      # database: # APPLICATION_TENANT_CACHE_REDIS_DATABASE=0, Redis database number, 0 when not set
